<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" viewport="width=device-width, initial-scale=1">
    <title>Врятуй кошеня</title>
    <script src="game.js" defer></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0 auto;
            padding: 16px;
            max-width: 600px;
            /* comfortable width on desktop */
            font-family: system-ui, sans-serif;
            font-size: 18px;
            line-height: 1.5;
        }

        h1 {
            font-size: clamp(1.5rem, 6vw, 2.5rem);
        }

        /* scales with screen width */

        input,
        button {
            font-size: 1rem;
            /* 16px+ stops iOS from zooming in on focus */
            min-height: 44px;
            /* easy-to-tap size */
            padding: 8px 12px;
        }

        #guess-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #level-input {
            flex: 1;
            min-width: 0;
        }
    </style>

</head>

<body>
    <h1>Врятуй кошеня</h1>
    <section id="start-screen">
        <p>Вітаємо у грі!</p>
        <button id="start-button">Почати гру</button>
    </section>
    <section id="game-container" hidden>
        <p id="levels">Виберіть поверх, на якому сидить кошеня: <span id="levels-value"></span></p>
        <p id="msg"></p>
        <form id="guess-form">
            <input type="number" id="level-input" required>
            <button id="check-button">Перевірити</button>
        </form>
        <p id="tries"></p>
        <ul id="history"></ul>
        <button id="restart">Грати знову</button>
    </section>
</body>

</html>
